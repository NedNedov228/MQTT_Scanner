name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev tools
        run: |
          python -m pip install uv==0.13.0
          uv sync --extra dev --locked
      - name: Static checks
        run: |
          .venv/bin/ruff check src tests lab/setup.py
          .venv/bin/ruff format --check src tests lab/setup.py
          .venv/bin/mypy src tests lab/setup.py
      - name: Audit dependencies
        run: .venv/bin/pip-audit
      - name: Start isolated MQTT lab
        run: make lab-up
      - name: Test against real Mosquitto listeners
        env:
          MQTT_LAB: "1"
        run: .venv/bin/pytest -q
      - name: Build distributions
        run: .venv/bin/python -m build
      - name: Verify installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          uv venv wheel-check
          uv pip install --python wheel-check/bin/python "${{ github.workspace }}/dist/mqtt_security_scanner-0.1.0-py3-none-any.whl"
          wheel-check/bin/mqtt-scanner --help
          wheel-check/bin/mqtt-scanner check localhost --port 18832 --transport tls --ca-file "${{ github.workspace }}/lab/generated/ca.pem" --output wheel-reports
      - name: Stop lab
        if: always()
        run: make lab-down
